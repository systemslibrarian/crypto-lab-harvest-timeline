name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The unit suite: risk-engine, scenarios, rekey, ui, contrast and the
      # jsdom a11y check. Deploying on `test:a11y` alone meant none of these
      # blocked a publish — a broken risk model could ship so long as the
      # broken page stayed accessible.
      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # `test:a11y` is `playwright test` — it runs the whole browser suite
      # (claims.spec.ts, rekey.spec.ts and a11y.spec.ts), not just the axe pass.
      - name: Browser claims and accessibility gate
        run: npm run test:a11y

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
